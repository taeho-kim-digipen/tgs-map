name: Apply floor toggle and zoom density

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-floor-density-v3.cjs'
      - '.github/workflows/apply-floor-density-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply UI patch
        run: node scripts/apply-floor-density-v3.cjs
      - name: Validate JavaScript
        run: node --check dist/app.js
      - name: Commit patched site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/app.js dist/index.html dist/style.css dist/sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Add floor switch and zoom-based map detail'
          git push
