name: Audit unnamed booths

on:
  push:
    branches: [main]
    paths:
      - 'dist/map-data.json'
      - 'scripts/audit-unnamed-booths.cjs'
      - '.github/workflows/audit-unnamed-booths.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/audit-unnamed-booths.cjs
      - name: Commit audit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unnamed-booths.json
          git diff --cached --quiet && exit 0
          git commit -m 'Audit unnamed booth names'
          git push
