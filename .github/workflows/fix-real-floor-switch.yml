name: Fix real floor switching

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-real-floor-switch.cjs'
      - '.github/workflows/fix-real-floor-switch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify switchable campus layers exist
        run: |
          grep -q 'id="official-1f-overlay"' dist/campus.svg
          grep -q 'id="official-2f-overlay"' dist/campus.svg
      - name: Apply true floor switch
        run: node scripts/fix-real-floor-switch.cjs
      - name: Validate JavaScript
        run: node --check dist/app.js
      - name: Commit fixed site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/app.js dist/index.html dist/sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Switch actual 1F and 2F map layers'
          git push
