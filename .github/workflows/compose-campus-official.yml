name: Compose official TGS campus map

on:
  push:
    branches: [main]
    paths:
      - 'scripts/compose-campus-official.cjs'
      - 'sources/navigation/registration.json'
      - 'dist/map-data.json'
      - '.github/workflows/compose-campus-official.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Overlay original TGS PDF-derived SVG panels
        run: node scripts/compose-campus-official.cjs
      - name: Commit regenerated campus map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/campus.svg
          git diff --cached --quiet && exit 0
          git commit -m 'Overlay official TGS maps on campus view'
          git push
