name: Fix inset booths and facility navigation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-inset-facility-navigation.cjs'
      - '.github/workflows/fix-inset-facility-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply inset and facility navigation patch
        run: node scripts/fix-inset-facility-navigation.cjs
      - name: Validate generated JavaScript
        run: |
          node --check dist/app.js
          node --check dist/navigation/tgs-navigation.js
          grep -q "toggleFacility" dist/navigation/tgs-navigation.js
          grep -q "targetFacilityId" dist/navigation/tgs-navigation.js
          grep -q "booth-peek-route" dist/app.js
          grep -q "map-label.inset" dist/style.css
          grep -q "2026.09.18.5" dist/sw.js
      - name: Commit fixed site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/app.js dist/navigation/tgs-navigation.js dist/style.css dist/index.html dist/sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Enable inset booth taps and facility routing'
          git push
